# ~/.config/hypr/hyprlock.conf
background {
    monitor =
    path = ~/Pictures/wallpapers/default.png
    blur_size = 400
    blur_passes = 3
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    color = rgba(e6e9efee)
    position = 0, 200
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    dots_center = true
    placeholder_text = 输入密码…
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}
