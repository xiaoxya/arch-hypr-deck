# ~/.config/hypr/hyprland.conf — arch-hypr-deck

# ---------- 输入法环境变量（fcitx5 + rime 必需）----------
env = XCURSOR_SIZE,24
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# ---------- 监视器（自动）----------
monitor=,preferred,auto,auto

# ---------- 输入 ----------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

gestures {
    workspace_swipe = true
}

# ---------- 外观 ----------
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(a78bfaee) rgba(60a5faee)
    col.inactive_border = rgba(45475a99)
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 12
        render_power = 3
    }
}

animations {
    enabled = true
    bezier = smooth, 0.25, 0.1, 0.25, 1
    animation = windows, 1, 5, smooth, popin 80%
    animation = fade, 1, 5, smooth
    animation = workspaces, 1, 4, smooth, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# ---------- 自动启动 ----------
exec-once = waybar
exec-once = mako
exec-once = fcitx5 -d --replace
exec-once = hypridle
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = nm-applet --indicator
exec-once = ~/.local/bin/wallpaper.sh
exec-once = systemctl --user start hyprpolkitagent.service 2>/dev/null || true

# ---------- 窗口规则 ----------
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, title:^(Picture-in-Picture)$, size 960 540, pin
windowrulev2 = opacity 0.92 0.92, class:^(kitty)$

# ---------- 键位 ----------
$mod = SUPER

bind = $mod, Return, exec, kitty
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, E, exec, thunar
bind = $mod, D, exec, ~/.local/bin/launcher.sh
bind = $mod, L, exec, hyprlock
bind = , Print, exec, ~/.local/bin/screenshot.sh full
bind = SHIFT, Print, exec, ~/.local/bin/screenshot.sh region

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# 多媒体 / 亮度 / 音量
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
